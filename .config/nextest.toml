[profile.ci]
# A hung test fails fast and BY NAME instead of eating the 30-minute job:
# slow tests log after 30s, hard-fail at 90s (cli_tests spawns shells that
# read stdin; a hang there is a bug to name, not a timeout to nurse).
slow-timeout = "30s"
timeout-source = "profile"
termination-timeout = "10s"

# Chaîne aphrody (workflow « aphrody tests ») : même profil, mais un test bloqué est tué après 4 périodes
# (2 min) au lieu de bloquer la part jusqu'au délai du job.
[profile.aphrody]
slow-timeout = { period = "30s", terminate-after = 4 }
# Tests de contrôle de jobs sensibles au minutage (issue2340 bare_wait_survivor : rouge 1 fois sur 3 runs) :
# nextest les relance et les signale « flaky » au lieu de rougir la part.
retries = 2
timeout-source = "profile"
termination-timeout = "10s"
