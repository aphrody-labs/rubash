name: aphrody tests

# Suite complète de rubash pour la chaîne aphrody (monorepo src, docs/unixwin/LEARNINGS.md), sur le même socle
# que la CI amont (sous-modules, binaire construit avant les tests, fixture bashdb, nextest profil ci avec
# délais) : bibliothèque, puis tests/*.rs découpés en parts. Les exclusions sont celles de l'amont
# (scripts/ci-pin-exclusions.txt). ulimit -n relevé, TMPDIR sur /mnt (disque du runner, hors $HOME). prd n'exécute plus la suite.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [lib, cargo, pins-0, pins-1, pins-2, pins-3, pins-4, pins-5, other]
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare external bashdb fixture
        run: |
          git clone --depth 1 --branch bash-5.3 https://github.com/Trepan-Debuggers/bashdb.git target/bashdb-source
          cd target/bashdb-source
          bash ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/target/bashdb-install"
          make -j2
          make install
          cd "$GITHUB_WORKSPACE"
          bash scripts/setup-bashdb-fixture.sh target/bashdb-install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the rubash binary
        run: cargo build --locked
      - name: Run part
        shell: bash
        run: |
          ulimit -n 65536
          # TMPDIR sur disque mais hors de $HOME : sous ~/work, dirs/pushd abrègent les chemins en ~ et les
          # tests de pile de répertoires (issue2391, 2424, 2937, 3196, 3335...) comparent des chemins absolus.
          sudo install -d -o "$USER" /mnt/rubash-tmp
          export TMPDIR=/mnt/rubash-tmp
          part='${{ matrix.part }}'
          if [ "$part" = lib ]; then
            # Bibliothèque par cargo test : sous nextest, issue2875 (enfant de procsub) relance le binaire de test
            # (« Unrecognized option: c », rouge aussi en amont) ; sous cargo test le test passe (prd, 2026-11-13).
            exec cargo test --locked --lib -- --test-threads=4
          fi
          mapfile -t cargo_only < <(grep -vE '^(#|$)' .config/aphrody-cargo-test.txt)
          if [ "$part" = cargo ]; then
            cargo_args=()
            for stem in "${cargo_only[@]}"; do cargo_args+=(--test "$stem"); done
            exec cargo test --locked --no-fail-fast "${cargo_args[@]}" -- --test-threads=4
          fi
          mapfile -t excluded < <(grep -vE '^(#|$)' scripts/ci-pin-exclusions.txt | cut -d' ' -f1)
          excluded+=("${cargo_only[@]}")
          args=()
          i=0
          for f in tests/*.rs; do
            stem=$(basename "$f" .rs)
            case " ${excluded[*]} " in *" $stem "*) continue ;; esac
            case "$part" in
              other) [[ $stem == issue* ]] && continue ;;
              pins-*)
                [[ $stem == issue* ]] || continue
                [ $((i % 6)) -eq "${part#pins-}" ] || { i=$((i + 1)); continue; }
                i=$((i + 1))
                ;;
            esac
            args+=(--test "$stem")
          done
          echo "part $part : $(( ${#args[@]} / 2 )) cibles"
          cargo nextest run --profile aphrody --no-fail-fast "${args[@]}"
